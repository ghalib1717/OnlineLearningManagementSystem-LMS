<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management | EduLearn LMS</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

<header class="top">
    <div class="brand">🎓 EduLearn LMS</div>

    <nav>
        <a href="/admin">Dashboard</a>
        <a href="/admin/users">Users</a>
        <a href="/admin/courses" class="active">Courses</a>
        <a href="/admin/settings">Settings</a>
    </nav>

    <div class="who">
        <span>{{ADMIN_NAME}}</span>
        <span class="tag">ADMIN</span>
        <a class="btn sm ghost" href="/logout">Logout</a>
    </div>
</header>

<main>

    <h1>Course Management</h1>

    <section class="card">
        <h2>{{FORM_TITLE}}</h2>

        <form method="post" action="/admin/do/saveCourse">

            {{HIDDEN_ID}}

            <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{COURSE_TITLE}}"
                required
            >

            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                rows="4"
            >{{COURSE_DESCRIPTION}}</textarea>

            <label for="syllabus">Syllabus</label>
            <textarea
                id="syllabus"
                name="syllabus"
                rows="4"
            >{{COURSE_SYLLABUS}}</textarea>

            <label for="instructor_id">Instructor</label>
            <select id="instructor_id" name="instructor_id" required>
                {{INSTRUCTOR_OPTIONS}}
            </select>

            <button class="btn" type="submit">{{FORM_BUTTON}}</button>

        </form>
    </section>

    <section class="card">
        <h2>All Courses</h2>
        <div id="courses-table">{{COURSES_TABLE}}</div>
    </section>

</main>

<footer>
    EduLearn LMS &middot; Java Servlets + JDBC + H2
    &middot; Galgotias University
</footer>

<script src="/js/script.js"></script>

</body>
</html>
